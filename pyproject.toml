[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmv-turismo"
version = "0.1.0"
description = "Tourism recommender: semantic POI model calibrated with real visitor behaviour"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "numpy>=2.0,<3",
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
# Only needed to (re)generate embeddings: pulls in torch.
embeddings = ["sentence-transformers>=3.1.0", "torch>=2.3"]
# Free-text interests and search in the service, with the ONNX export of the text
# model mounted at QUERY_MODEL_DIR (no torch)
query = ["onnxruntime>=1.20,<2", "tokenizers>=0.20,<1"]
# Reading the POIs from an NGSI-LD broker / data space connector
dataspace = [
  "filip~=0.8.1",
  "ds-consumer-auth @ git+https://github.com/CitComAI-Hub/ds-consumer-auth@v0.1.0",
]
dev = ["pytest", "httpx", "jsonschema[format-nongpl]", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "venv", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
