# TEF city eindhoven: generated by research/make_city_configs.py
data:
  raw_dir: data/cities/eindhoven/raw
  processed_dir: data/cities/eindhoven/processed
ingestion:
  fetch_images: true
  require_description: true
  generated_description_min_facts: 1
  heritage:
    enabled: false
    municipality: VALÈNCIA
    max_distance_m: 60
    sources:
      BIC: https://dadesobertes.gva.es/dataset/da443c69-9c66-4e25-bdd7-8fdb8fe7cda9/resource/2271efdd-d0cc-4126-a9a0-dd11d56acbde/download/bienes_inmuebles_interes_cultural.csv
      BRL: https://dadesobertes.gva.es/dataset/da443c69-9c66-4e25-bdd7-8fdb8fe7cda9/resource/0619adb1-e458-4b2a-ae6a-6bad5f00b6c9/download/bienes_inmuebles_relevancia_local.csv
  osm:
    enabled: true
  overpass_urls:
  - https://overpass-api.de/api/interpreter
  - https://overpass.kumi.systems/api/interpreter
  - https://lz4.overpass-api.de/api/interpreter
  - https://overpass.openstreetmap.ru/api/interpreter
  request_timeout_seconds: 180
  workers: 4
  pageview_days: 60
  pageview_languages:
  - es
  - ca
  - en
  - fr
  - de
  - it
  - pt
  - nl
  - ru
  - pl
  - ja
  - zh
  allow_partial: false
  area_name: Eindhoven
  area_admin_level: 8
  area_boundary: administrative
  area_relation_id: 47504
  bbox: null
  tag_filters:
  - key: tourism
    values:
    - attraction
    - museum
    - gallery
    - artwork
    - viewpoint
    - information
    - picnic_site
    - theme_park
    - zoo
    - aquarium
  - key: historic
    values:
    - '*'
  - key: heritage
    values:
    - '*'
  - key: memorial
    values:
    - '*'
  - key: leisure
    values:
    - park
    - garden
    - nature_reserve
  - key: natural
    values:
    - peak
    - beach
    - waterfall
  - key: man_made
    values:
    - tower
    - lighthouse
    - windmill
    - bridge
  - key: building
    values:
    - cathedral
  - key: amenity
    values:
    - place_of_worship
  dedup:
    enabled: true
    max_distance_m: 80
    min_name_similarity: 0.82
    prefer_sources:
    - osm
    report_path: data/cities/eindhoven/processed/dedup_matches.csv
  google_places:
    enabled: false
    radius_m: 250
    min_name_similarity: 0.75
  address_locality: Eindhoven
  address_country: NL
  description_languages:
  - en
  - nl
embeddings:
  model_id: google/embeddinggemma-300m
  device: cpu
  batch_size: 16
  normalize: true
  show_progress: true
  output_path: data/cities/eindhoven/processed/embeddings.jsonl
recommendation:
  top_n: 30
  distance_scale_km: 0.3
  dislike_weight: 0.1
  filter_opening_hours: true
behaviour:
  source: Flickr YFCC100M (2004-2014), Eindhoven
