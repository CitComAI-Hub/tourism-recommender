data:
  raw_dir: data/raw
  processed_dir: data/processed

ingestion:
  fetch_images: true
  require_description: true
  # POIs without any source text get a description built from their OSM tags
  # and heritage status (artist, material, year, inscription, BIC/BRL...) if
  # it states at least this many facts beyond the kind of place.
  generated_description_min_facts: 1
  # Protected heritage from the Inventario General del Patrimonio Cultural
  # Valenciano (Generalitat Valenciana, dadesobertes.gva.es, CC BY 4.0).
  heritage:
    enabled: true
    municipality: "VALÈNCIA"
    max_distance_m: 60
    sources:
      BIC: https://dadesobertes.gva.es/dataset/da443c69-9c66-4e25-bdd7-8fdb8fe7cda9/resource/2271efdd-d0cc-4126-a9a0-dd11d56acbde/download/bienes_inmuebles_interes_cultural.csv
      BRL: https://dadesobertes.gva.es/dataset/da443c69-9c66-4e25-bdd7-8fdb8fe7cda9/resource/0619adb1-e458-4b2a-ae6a-6bad5f00b6c9/download/bienes_inmuebles_relevancia_local.csv
  # Artworks inside these areas become one POI for the whole collection
  # (individually they are rarely visited and would flood the catalog).
  artwork_collections:
    - area_relation: 3322903        # Campus de Vera de la UPV (OSM)
      wikidata: Q30133840           # Campus Escultòric de la UPV
      name: "Campus Escultòric de la Universitat Politècnica de València"
      area_name: "campus de Vera de la Universitat Politècnica de València"
  osm:
    enabled: true
  overpass_urls:
    - https://overpass-api.de/api/interpreter
    - https://overpass.kumi.systems/api/interpreter
    - https://lz4.overpass-api.de/api/interpreter
    - https://overpass.openstreetmap.ru/api/interpreter
  request_timeout_seconds: 180
  # Parallel requests to Wikimedia APIs during enrichment
  workers: 4
  # Popularity = pageviews over the last N days summed over these Wikipedia editions
  pageview_days: 60
  pageview_languages: [es, ca, en, fr, de, it, pt, nl, ru, pl, ja, zh]
  # Keep the previous catalog if any enrichment request fails
  allow_partial: false
  area_name: Valencia
  area_admin_level: 8
  area_boundary: administrative
  area_relation_id: 344953
  bbox: null
  tag_filters:
    - key: tourism
      values: ["attraction", "museum", "gallery", "artwork", "viewpoint", "information", "picnic_site", "theme_park", "zoo", "aquarium"]
    - key: historic
      values: ["*"]
    - key: heritage
      values: ["*"]
    - key: memorial
      values: ["*"]
    - key: leisure
      values: ["park", "garden", "nature_reserve"]
    - key: natural
      values: ["peak", "beach", "waterfall"]
    # - key: amenity
    #   values: ["restaurant", "cafe", "bar", "fast_food", "toilets", "parking", "drinking_water"]
    # - key: shop
    #   values: ["souvenir", "gift", "local_products"]
    - key: man_made
      values: ["tower", "lighthouse", "windmill", "bridge"]
    - key: building
      values: ["cathedral"]
    - key: amenity
      values: ["place_of_worship"]
  dedup:
    enabled: true
    max_distance_m: 80
    min_name_similarity: 0.82
    prefer_sources: ["osm"]
    report_path: data/processed/dedup_matches.csv
  google_places:
    enabled: false
    # api_key: from the GOOGLE_PLACES_API_KEY environment variable (.env)
    radius_m: 250
    min_name_similarity: 0.75

embeddings:
  model_id: google/embeddinggemma-300m
  device: cpu
  batch_size: 16
  normalize: true
  show_progress: true
  output_path: data/processed/embeddings.jsonl

recommendation:
  top_n: 30
  # score = minmax(log popularity + next_weight * log(1 + 100 P(next | last visited))
  #                - distance penalty)
  #         + similarity_weight * minmax(behaviour-adapted similarity to the likes)
  #         + interest_weight * stated interests
  #         - dislike_weight * minmax(similarity to the dislikes)
  # distance penalty: log -> distance_log_weight * log(km + 0.05); linear -> km / distance_scale_km.
  # Chosen on validation splits of real tourist visits (research/protocol.py v4):
  # log in 11 of 12 choices (Valencia 1.0-1.5, Milano 2-4: per city); vs linear,
  # hit@10 +0.023 (p=0.035) Valencia users split, +0.008..0.012 n.s. elsewhere,
  # tail +0.03..0.08 in all four splits. With log distance the validation picks
  # similarity 0.15-0.5 in 4 of 6 Valencia choices (test effect +0.004..0.009,
  # n.s.; 0 in most Milano choices). Next weight 1.0 in most. Dislikes cannot be
  # measured on photos (nobody photographs what they dislike): a small weight
  # that only reacts to the user's explicit feedback.
  distance_form: log
  distance_log_weight: 1.0
  distance_scale_km: 0.3
  similarity_weight: 0.15
  next_weight: 1.0
  dislike_weight: 0.1
  # What the user says they like in free text ("Roman ruins, baroque churches"):
  # similarity of the descriptions to it (top quarter, 0-1), added to the score.
  # Not measurable on photos (they show where people went, not what they asked
  # for): a product choice, high enough that a stated interest shows up.
  interest_weight: 1.0
  filter_opening_hours: true

behaviour:
  # Model learnt offline from geotagged photos (`--step behaviour`); without it the
  # service ranks by Wikipedia popularity and plain embeddings.
  # model_path: data/processed/behaviour_model.npz
  # Pseudonymised photos (user, lat, lon, ts); exported by research/eval_service.py
  photos_path: data/raw/yfcc/valencia_photos.jsonl.gz
  source: "Flickr YFCC100M (2004-2014), Valencia"

