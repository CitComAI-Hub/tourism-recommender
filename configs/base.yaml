modules:
  ingestion:
    enabled: true
  catalog:
    enabled: true
  embeddings:
    enabled: true
  recommendation:
    enabled: true
  planning:
    enabled: true
  api:
    enabled: true
  evaluation:
    enabled: true

data:
  raw_dir: data/raw
  processed_dir: data/processed

ingestion:
  fetch_images: true
  require_description: true
  # POIs without any source text get a description built from their OSM tags
  # and heritage status (artist, material, year, inscription, BIC/BRL...) if
  # it states at least this many facts beyond the kind of place.
  generated_description_min_facts: 1
  # Protected heritage from the Inventario General del Patrimonio Cultural
  # Valenciano (Generalitat Valenciana, dadesobertes.gva.es, CC BY 4.0).
  heritage:
    enabled: true
    municipality: "VALÈNCIA"
    max_distance_m: 60
    sources:
      BIC: https://dadesobertes.gva.es/dataset/da443c69-9c66-4e25-bdd7-8fdb8fe7cda9/resource/2271efdd-d0cc-4126-a9a0-dd11d56acbde/download/bienes_inmuebles_interes_cultural.csv
      BRL: https://dadesobertes.gva.es/dataset/da443c69-9c66-4e25-bdd7-8fdb8fe7cda9/resource/0619adb1-e458-4b2a-ae6a-6bad5f00b6c9/download/bienes_inmuebles_relevancia_local.csv
  osm:
    enabled: true
  overpass_urls:
    - https://overpass-api.de/api/interpreter
    - https://overpass.kumi.systems/api/interpreter
    - https://lz4.overpass-api.de/api/interpreter
    - https://overpass.openstreetmap.ru/api/interpreter
  request_timeout_seconds: 180
  # Parallel requests to Wikimedia APIs during enrichment
  workers: 4
  # Popularity = pageviews over the last N days summed over these Wikipedia editions
  pageview_days: 60
  pageview_languages: [es, ca, en, fr, de, it, pt, nl, ru, pl, ja, zh]
  # Keep the previous catalog if any enrichment request fails
  allow_partial: false
  area_name: Valencia
  area_admin_level: 8
  area_boundary: administrative
  area_relation_id: 344953
  bbox: null
  tag_filters:
    - key: tourism
      values: ["attraction", "museum", "gallery", "artwork", "viewpoint", "information", "picnic_site", "theme_park", "zoo", "aquarium"]
    - key: historic
      values: ["*"]
    - key: heritage
      values: ["*"]
    - key: memorial
      values: ["*"]
    - key: leisure
      values: ["park", "garden", "nature_reserve"]
    - key: natural
      values: ["peak", "beach", "waterfall"]
    # - key: amenity
    #   values: ["restaurant", "cafe", "bar", "fast_food", "toilets", "parking", "drinking_water"]
    # - key: shop
    #   values: ["souvenir", "gift", "local_products"]
    - key: man_made
      values: ["tower", "lighthouse", "windmill", "bridge"]
    - key: building
      values: ["cathedral"]
    - key: amenity
      values: ["place_of_worship"]
  dedup:
    enabled: true
    max_distance_m: 80
    min_name_similarity: 0.82
    prefer_sources: ["osm"]
    report_path: data/processed/dedup_matches.csv
  google_places:
    enabled: false
    # api_key: from the GOOGLE_PLACES_API_KEY environment variable (.env)
    radius_m: 250
    min_name_similarity: 0.75

embeddings:
  model_id: google/embeddinggemma-300m
  device: cpu
  batch_size: 16
  normalize: true
  show_progress: true
  output_path: data/processed/embeddings.jsonl

parameters:
  planning:
    max_stops_per_day: 6
    visit_time_minutes: 60
    max_total_minutes: 420
    max_candidates: 20
    # Next stop maximises score / (1 + travel_minutes / travel_penalty_minutes)
    travel_penalty_minutes: 15
    respect_opening_hours: true
    # start_time: "10:00"   # default: current time (Europe/Madrid)
    start_location:
      name: "Plaza del Ayuntamiento"
      lat: 39.4699
      lon: -0.3763
    routing:
      provider: openrouteservice
      # api_key: from the ORS_API_KEY environment variable (.env)
      profile: foot-walking
      endpoint: https://api.openrouteservice.org
      # Para usar OSRM público en vez de ORS, comenta las dos líneas anteriores y usa:
      # provider: osrm
      # endpoint: https://router.project-osrm.org
      # profile: foot

recommendation:
  top_n: 30
  # alpha/beta/gamma are normalised to sum 1 (semantic / popularity / distance)
  alpha: 0.5
  beta: 0.3
  gamma: 0.2
  lambda_geo: 0.5
  theta_mmr: 0.7
  hidden_gems_bias: 0.0
  multi_interest_enabled: true
  multi_interest_k: 3
  dislike_weight: 0.5
  # Score bonus for POIs in the categories picked during onboarding (normalised
  # with alpha/beta/gamma). Best single lever in the persona evaluation.
  category_weight: 0.3
  # Share of the semantic score taken by the free-text interests typed in
  # onboarding (query embedding, min-max scaled). Ignored without text.
  interest_text_weight: 0.5
  filter_opening_hours: true
  # Onboarding: Beta posterior of P(like) smoothed over embedding similarity,
  # ranked by mean + exploration * std (UCB). Bandwidth: cosine scale over
  # which a swipe propagates; prior_strength: swipes needed to beat the prior.
  active_learning_bandwidth: 0.1
  active_learning_prior_strength: 2.0
  active_learning_exploration: 1.0
  active_learning_popularity_weight: 0.15
  active_learning_interest_weight: 0.3
  # CLI only: `--step recommendation` needs seed likes (POI ids) and a style
  liked_pois: []
  style: explorer
  # Weight overrides per user-selectable style. Each one leads a different
  # axis instead of trading accuracy away: explorer = most varied list,
  # conservative = popular and nearby, hidden_gems = lesser-known places.
  # Useful diversity range on this catalog is ~0.49-0.59 ILD: theta < 0.5
  # barely adds variety but recommends unrelated POIs (see evaluation sweep).
  # Explorer uses 0.6, not 0.5: on the personas 0.5 bought +0.05 ILD at the
  # cost of ~10% precision.
  styles:
    explorer:
      alpha: 0.6
      beta: 0.2
      gamma: 0.2
      theta_mmr: 0.6
      hidden_gems_bias: 0.5
    conservative:
      alpha: 0.5
      beta: 0.2
      gamma: 0.3
      theta_mmr: 1.0
      hidden_gems_bias: 0.0
    hidden_gems:
      alpha: 0.6
      beta: 0.25
      gamma: 0.15
      theta_mmr: 0.7
      hidden_gems_bias: 1.0

evaluation:
  k: 10
  seed: 42
  synthetic_users: 40
  # Card counts per onboarding round in the simulation (match the frontend)
  onboarding_rounds: [6, 4, 4]
  # Hand-labelled personas (categories + relevant POIs) for the persona evaluation
  personas_path: data/eval/personas.json
